<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f5fa8">
<title>EDT Kingdom</title>
<link rel="stylesheet" href="style.css?v=35">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon2-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EDT Kingdom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div id="app">
  <div id="loading"><img src="img/edt_title.webp" class="ld-logo" alt="Enduro Drinking Kingdom"><div class="ld-bar"><i></i></div><small>Si scaldano i motori…</small></div>

  <!-- CAMPO BASE -->
  <section id="home" class="screen active">
    <header class="topbar">
      <div class="pill"><span class="ico"><i class="ic ic-star"></i></span><b id="hStars">0</b></div>
      <div class="title brand"><img src="img/edt_title.webp" alt="Enduro Drinking Kingdom" class="brandlogo"></div>
      <button id="btnSettings" class="round gear" aria-label="Impostazioni">⚙</button>
      <div class="pill"><span class="ico"><i class="ic ic-coin"></i></span><b id="hCoins">0</b></div>
    </header>
    <div id="map"></div>
    <div class="sidebtns"><button id="btnLevels" class="sidebtn"><i class="ic ic-star"></i><small>Livelli</small></button><button id="btnRank" class="sidebtn"><span>🏆</span><small>Classifica</small></button><button id="btnWeek" class="sidebtn"><span>🏁</span><small>Sfida</small><b class="wkpct" id="weekPct">0%</b></button><button id="btnEvent" class="sidebtn evbtn" hidden><span class="evi"></span><small>Evento</small><b class="wkpct" id="evPct">0</b></button><button id="btnAlbum" class="sidebtn"><span>📒</span><small>Album</small><b class="wkpct" id="albPct">0</b></button><button id="btnGuide" class="sidebtn"><span class="q">?</span><small>Guida</small></button></div>
    <div class="homebar">
      <div class="job" id="job">
        <div class="jobimg" id="jobImg"></div>
        <div class="jobtxt">
          <small>Prossimo lavoro</small>
          <b id="jobName">Bandiera EDT</b>
          <div class="steps" id="jobSteps"></div>
        </div>
        <button id="btnBuild" class="btn btn-build"><span id="buildLbl">Costruisci</span><small id="buildCost"></small></button>
      </div>
      <button id="btnPlay" class="btn btn-play">Gioca <b id="hLevel">1</b></button>
    </div>
  </section>

  <!-- PARTITA -->
  <section id="game" class="screen">
    <header class="gamebar">
      <button id="btnBack" class="round" aria-label="Pausa">II</button>
      <div class="goalwrap"><div class="goals" id="goals"></div><div class="lvlLabel ribbon">Livello <b id="gLevel">1</b></div></div>
      <div class="moves"><small>MOSSE</small><b id="moves">0</b></div>
    </header>
    <div id="bossbar" class="bossbar hidden">
      <div class="bossface" id="bossFace"></div>
      <div class="hp"><div id="bossHp"></div><span id="bossTxt"></span></div>
      <div class="bosscount" title="Mosse al prossimo sasso"><span>🪨</span><b id="bossCount">5</b></div>
    </div>
    <div id="boardWrap">
      <div id="board"></div>
      <div id="fx"></div>
    </div>
    <footer class="boosters">
      <div class="peek" id="peek"><i></i><span id="peekTxt"></span></div>
      <div class="shelf">
        <button id="bHammer" class="booster"><span class="bi ic-hammer"></span><small>Martello</small><b>100 <i class="ic ic-coin"></i></b></button>
        <button id="bMoto" class="booster"><span class="bi bi-moto"></span><small>Moto</small><b>120 <i class="ic ic-coin"></i></b></button>
        <button id="bTanica" class="booster"><span class="bi bi-tanica"></span><small>Tanica</small><b>180 <i class="ic ic-coin"></i></b></button>
        <button id="bShield" class="booster"><span class="bi ic-shield"></span><small>Scudo</small><b>150 <i class="ic ic-coin"></i></b></button>
        <button id="bHelp" class="booster helpb"><span class="bi">💡</span><small>Aiuto</small></button>
      </div>
    </footer>
  </section>

  <canvas id="fxc"></canvas>

  <!-- OVERLAY -->
  <div id="overlay" class="overlay hidden">
    <div class="card" id="card"></div>
  </div>
  <div id="toast" class="toast"></div>
</div>
<script src="game.min.js?v=35"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
